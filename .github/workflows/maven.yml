name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Test with Maven
      run: mvn -B test

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      trivy-summary: ${{ steps.trivy-summary.outputs.summary }}
      trivy-has-issues: ${{ steps.trivy-summary.outputs.has-issues }}

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t d13revision:${{ github.sha }} .

    - name: Run Trivy container scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: d13revision:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: 0
        output: trivy-results.txt

    - name: Extract Trivy summary
      id: trivy-summary
      run: |
        SUMMARY=$(tail -8 trivy-results.txt 2>/dev/null || echo "No results")
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if grep -qE "HIGH|CRITICAL" trivy-results.txt 2>/dev/null; then
          echo "has-issues=true" >> $GITHUB_OUTPUT
        else
          echo "has-issues=false" >> $GITHUB_OUTPUT
        fi

  docker-push:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/d13revision:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/d13revision:latest

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      snyk-summary: ${{ steps.snyk-summary.outputs.summary }}
      snyk-has-issues: ${{ steps.snyk-summary.outputs.has-issues }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Snyk CLI
      uses: snyk/actions/setup@master

    - name: Run Snyk Test
      run: snyk test --severity-threshold=high 2>&1 | tee snyk-results.txt
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Extract Snyk summary
      if: always()
      id: snyk-summary
      run: |
        SUMMARY=$(grep -E "found [0-9]+ issues|Tested [0-9]+" snyk-results.txt | tail -3 || echo "No summary")
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if grep -qE "found [1-9][0-9]* issues" snyk-results.txt 2>/dev/null; then
          echo "has-issues=true" >> $GITHUB_OUTPUT
        else
          echo "has-issues=false" >> $GITHUB_OUTPUT
        fi

  notify:
    needs: [build-test, docker-build, docker-push, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ${{ (needs.build-test.result != 'success' || needs.docker-build.result != 'success' || needs.docker-push.result == 'failure' || needs.security-scan.result != 'success') && '❌ Pipeline FAILED' || (needs.docker-build.outputs.trivy-has-issues == 'true' || needs.security-scan.outputs.snyk-has-issues == 'true') && '⚠️ Pipeline PASSED (with security findings)' || '✅ Pipeline PASSED' }}

          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}
          Triggered by: ${{ github.actor }}

          build-test: ${{ needs.build-test.result }}
          docker-build: ${{ needs.docker-build.result }}
          docker-push: ${{ needs.docker-push.result }}
          security-scan: ${{ needs.security-scan.result }}

          📦 Trivy scan:
          ${{ needs.docker-build.outputs.trivy-summary }}

          🔍 Snyk scan:
          ${{ needs.security-scan.outputs.snyk-summary }}

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Test with Maven
      run: mvn -B test

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t d13revision:${{ github.sha }} .

    - name: Run Trivy container scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: d13revision:${{ github.sha }}
        format: table
        severity: HIGH,CRITICAL
        exit-code: 0

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Snyk CLI
      uses: snyk/actions/setup@master

    - name: Run Snyk Test
      run: snyk test --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  notify:
    needs: [build-test, docker-build, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ${{ (needs.build-test.result == 'success' && needs.docker-build.result == 'success' && needs.security-scan.result == 'success') && '✅ Pipeline PASSED' || '❌ Pipeline FAILED' }}

          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}
          Triggered by: ${{ github.actor }}

          build-test: ${{ needs.build-test.result }}
          docker-build: ${{ needs.docker-build.result }}
          security-scan: ${{ needs.security-scan.result }}

          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
